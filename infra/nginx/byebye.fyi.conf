limit_req_zone $binary_remote_addr zone=byebye_mutations:10m rate=12r/m;

server {
    listen 80;
    server_name byebye.fyi;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/byebye;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name byebye.fyi;

    ssl_certificate /etc/letsencrypt/live/byebye.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byebye.fyi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # BYEBYE_AUTH
    client_max_body_size 101m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/byebye;
    }

    location ~ ^/api/backend/api/(upload|enrich|filter|services/[^/]+/(retry|sso))$ {
        limit_req zone=byebye_mutations burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/byebye-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/byebye-proxy.conf;
    }
}
